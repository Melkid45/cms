<link rel="stylesheet" href="./timeline.scss" />

<section
  class="block timeline timeline--rail"
  id="story"
  data-timeline
  data-timeline-duration="3200"
>
  <div class="container">
    <div class="block__body">
      <h2 class="block__title">FormFit through the years</h2>
      <div
        class="timeline__viewport"
        data-timeline-viewport
        tabindex="0"
        aria-label="FormFit company history"
      >
        <div class="timeline__track" data-timeline-track role="list">
          <div class="timeline__item" role="listitem">
            <button
              class="timeline__point"
              type="button"
              data-timeline-point
              aria-label="Show the 2017 milestone"
            >
              <span class="timeline__marker" aria-hidden="true"></span>
              <span class="block__subtitle">2017</span>
              <span class="timeline__description"
                >Founded by Dmitry Vlasov</span
              >
            </button>
          </div>
          <div class="timeline__item" role="listitem">
            <button
              class="timeline__point"
              type="button"
              data-timeline-point
              aria-label="Show the 2019 milestone"
            >
              <span class="timeline__marker" aria-hidden="true"></span>
              <span class="block__subtitle">2019</span>
              <span class="timeline__description"
                >Launched online coaching</span
              >
            </button>
          </div>
          <div class="timeline__item" role="listitem">
            <button
              class="timeline__point"
              type="button"
              data-timeline-point
              aria-label="Show the 2022 milestone"
            >
              <span class="timeline__marker" aria-hidden="true"></span>
              <span class="block__subtitle">2022</span>
              <span class="timeline__description"
                >Opened the dedicated training studio</span
              >
            </button>
          </div>
          <div class="timeline__item" role="listitem">
            <button
              class="timeline__point"
              type="button"
              data-timeline-point
              aria-label="Show the 2023 milestone"
            >
              <span class="timeline__marker" aria-hidden="true"></span>
              <span class="block__subtitle">2023</span>
              <span class="timeline__description"
                >200th client transformation</span
              >
            </button>
          </div>
          <div class="timeline__item" role="listitem">
            <button
              class="timeline__point"
              type="button"
              data-timeline-point
              aria-label="Show the 2025 milestone"
            >
              <span class="timeline__marker" aria-hidden="true"></span>
              <span class="block__subtitle">2025</span>
              <span class="timeline__description"
                >500+ clients, 94% success rate</span
              >
            </button>
          </div>
          <span class="timeline__line" aria-hidden="true"></span>
          <span
            class="timeline__fill"
            data-timeline-fill
            aria-hidden="true"
          ></span>
        </div>
      </div>
    </div>
  </div>
</section>
