<link rel="stylesheet" href="./gallery.scss" />

<section
  id="results"
  class="block gallery gallery--mosaic"
  aria-labelledby="results-gallery-title"
>
  <div class="container">
    <div class="block__body">
      <div class="block__row">
        <h2 class="block__title" id="results-gallery-title">Client results</h2>
      </div>

      <div class="gallery__grid" id="results-gallery">
        <figure class="gallery__featured">
          <img
            src="@/assets/images/result-woman-4-months-crop.png"
            alt="Client transformation after four months"
            loading="lazy"
            decoding="async"
          />
        </figure>
        <figure>
          <img
            src="@/assets/images/result-woman-comparison-crop.png"
            alt="Woman's four-month fitness transformation"
            loading="lazy"
            decoding="async"
          />
        </figure>
        <figure>
          <img
            src="@/assets/images/result-man-18kg-crop.png"
            alt="Man's eighteen-kilogram transformation"
            loading="lazy"
            decoding="async"
          />
        </figure>
        <figure>
          <img
            src="@/assets/images/result-man-30kg-crop.png"
            alt="Athlete's thirty-kilogram transformation"
            loading="lazy"
            decoding="async"
          />
        </figure>
        <figure>
          <img
            src="@/assets/images/result-woman-detail-crop.png"
            alt="Four-month client result"
            loading="lazy"
            decoding="async"
          />
        </figure>
      </div>
    </div>
  </div>
</section>
