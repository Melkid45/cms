<link rel="stylesheet" href="./timeline.scss" />

<section class="block timeline hidden" id="story" data-timeline data-timeline-duration="3200">
    <div class="container">
        <div class="block__body spacing--base">
            <h2 class="heading heading--2 heading--line-height">Our story</h2>
            <div class="timeline__viewport" data-timeline-viewport tabindex="0" aria-label="CleanSpace company history">
                <div class="timeline__track relative flex" data-timeline-track role="list">
                    <div class="timeline__item relative" role="listitem">
                        <button class="timeline__point flex column" type="button" data-timeline-point aria-label="Show the 2017 milestone">
                            <span class="timeline__marker" aria-hidden="true"></span>
                            <span class="heading heading--3 heading--normal">2017</span>
                            <span class="timeline__description text text--sm">Founded with one client in Brooklyn</span>
                        </button>
                    </div>
                    <div class="timeline__item relative" role="listitem">
                        <button class="timeline__point flex column" type="button" data-timeline-point aria-label="Show the 2019 milestone">
                            <span class="timeline__marker" aria-hidden="true"></span>
                            <span class="heading heading--3 heading--normal">2019</span>
                            <span class="timeline__description text text--sm">Opened a second location in Manhattan</span>
                        </button>
                    </div>
                    <div class="timeline__item relative" role="listitem">
                        <button class="timeline__point flex column" type="button" data-timeline-point aria-label="Show the 2021 milestone">
                            <span class="timeline__marker" aria-hidden="true"></span>
                            <span class="heading heading--3 heading--normal">2021</span>
                            <span class="timeline__description text text--sm">Opened a second location in Manhattan</span>
                        </button>
                    </div>
                    <div class="timeline__item relative" role="listitem">
                        <button class="timeline__point flex column" type="button" data-timeline-point aria-label="Show the 2022 milestone">
                            <span class="timeline__marker" aria-hidden="true"></span>
                            <span class="heading heading--3 heading--normal">2022</span>
                            <span class="timeline__description text text--sm">Switched to 100% eco-certified products</span>
                        </button>
                    </div>
                    <div class="timeline__item relative" role="listitem">
                        <button class="timeline__point flex column is-active" type="button" data-timeline-point aria-label="Show the 2026 milestone" aria-current="step">
                            <span class="timeline__marker" aria-hidden="true"></span>
                            <span class="heading heading--3 heading--normal">2026</span>
                            <span class="timeline__description text text--sm">2,400+ clients, 48 specialists, 3 cities</span>
                        </button>
                    </div>
                    <span class="timeline__line" aria-hidden="true"></span>
                    <span class="timeline__fill" data-timeline-fill aria-hidden="true"></span>
                </div>
            </div>
        </div>
    </div>
</section>
