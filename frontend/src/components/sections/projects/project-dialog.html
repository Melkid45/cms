<dialog class="projects-dialog" aria-labelledby="project-dialog-title" data-project-dialog>
  <form method="dialog" class="projects-dialog__bar"><button class="projects-dialog__close" aria-label="Close project" autofocus><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button></form>
  <div class="projects-dialog__media"><img class="projects-dialog__image" data-project-image alt="" width="1800" height="1200" /></div>
  <div class="projects-dialog__content section__content">
    <h2 class="heading heading--lg" id="project-dialog-title"></h2>
    <dl class="projects__facts" data-project-facts></dl>
    <p class="text text--lg section__description" data-project-description></p>
    <a class="button text text--sm" href="mailto:hello@example.com">Discuss a similar project</a>
  </div>
</dialog>
