<link rel="stylesheet" href="./contact.scss" />
<section class="section contact contact--form-led" id="contact-7" aria-label="Get in touch"><div class="container"><div class="contact__form-heading"><h2 class="heading heading--lg">Tell us what<br />you have in mind.</h2><p class="section__description text text--lg">A few details to start the conversation. We’ll take it from there.</p></div><div class="contact__wide-form"><form class="form" data-contact-form aria-label="Discuss your project">
  <div class="form__row">
    <label class="form__field text text--md">Your name <input class="form__input" name="name" autocomplete="name" placeholder="Alex Taylor" maxlength="120" required /></label>
    <label class="form__field text text--md">Email address <input class="form__input" type="email" name="email" autocomplete="email" placeholder="alex@company.com" maxlength="254" required /></label>
  </div>
  
  <label class="form__field text text--md">Tell us about your project <textarea class="form__input" name="message" placeholder="Your space, your ideas, and where you’d like to start." maxlength="5000" required></textarea></label>
  <div class="form__bottom"><button class="button text text--sm" type="submit">Discuss your project</button><p class="text text--sm text--muted">Preview form. No data is sent.</p></div>
  <p class="form__status text text--sm text--muted" role="status" aria-live="polite"></p>
</form></div></div></section>
