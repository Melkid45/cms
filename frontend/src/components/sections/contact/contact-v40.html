<link rel="stylesheet" href="./contact.scss" />
<section class="section contact contact--request" id="contact-40" aria-labelledby="contact-title-40"><div class="container"><div class="contact__request"><figure class="contact__request-media"><img class="contact__request-image" src="/images/hero/details.jpg" alt="Soft seating and sculptural lighting in a lounge" width="1800" height="1200" loading="lazy" /></figure><div class="contact__request-body"><div class="section__content"><h2 class="heading heading--lg" id="contact-title-40">Book a visit to measure your space</h2><p class="section__description text text--lg">Leave your address and contact details, and we will call you to agree on a convenient time.</p></div><form class="form contact__request-form" data-contact-form aria-label="Request a visit">
  <label class="form__field text text--md">Full name or company <input class="form__input" name="name" autocomplete="name" placeholder="Alex Taylor" maxlength="160" required /></label>
  <label class="form__field text text--md">Your address <input class="form__input" name="address" autocomplete="street-address" placeholder="12 Harbour Street, London" maxlength="255" required /></label>
  <label class="form__field text text--md">Email address <input class="form__input" type="email" name="email" autocomplete="email" placeholder="alex@company.com" maxlength="254" required /></label>
  <label class="form__field text text--md">Phone number <input class="form__input" type="tel" name="phone" autocomplete="tel" placeholder="+44 20 7946 0958" maxlength="40" required /></label>
  <label class="form__check text text--sm"><input class="form__check-input" type="checkbox" name="whatsapp" value="yes" /><span>This number has WhatsApp, and I prefer a reply there.</span></label>
  <div class="form__bottom"><button class="button button--accent text text--sm" type="submit">Send request</button></div>
  <p class="form__status text text--sm text--muted" role="status" aria-live="polite"></p>
</form></div></div></div></section>
