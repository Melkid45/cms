<link rel="stylesheet" href="./contact.scss" />
<section class="section contact" id="contact-4" aria-label="Get in touch"><div class="container"><div class="contact__split"><div class="section__content"><h2 class="heading heading--lg">Let’s talk<br />about your space.</h2><p class="section__description text text--lg">Share a little about your project, and we can work out what comes next.</p><div class="contact__details"><div class="contact__detail"><span class="text text--sm text--muted">Email us</span><a class="contact__email text-link text text--lg" href="mailto:hello@example.com">hello@example.com</a></div><div class="contact__detail"><span class="text text--sm text--muted">How we work</span><p class="text text--md">In person or remotely.<br />The same care, wherever you are.</p></div></div></div><div class="contact__form-panel"><form class="form" data-contact-form aria-label="Discuss your project">
  <div class="form__row">
    <label class="form__field text text--md">Your name <input class="form__input" name="name" autocomplete="name" placeholder="Alex Taylor" maxlength="120" required /></label>
    <label class="form__field text text--md">Email address <input class="form__input" type="email" name="email" autocomplete="email" placeholder="alex@company.com" maxlength="254" required /></label>
  </div>
  <label class="form__field text text--md">Company <span class="text text--sm text--muted">Optional</span><input class="form__input" name="company" autocomplete="organization" placeholder="Your company" maxlength="160" /></label>
  <label class="form__field text text--md">Tell us about your project <textarea class="form__input" name="message" placeholder="Your space, your ideas, and where you’d like to start." maxlength="5000" required></textarea></label>
  <div class="form__bottom"><button class="button text text--sm" type="submit">Discuss your project</button><p class="text text--sm text--muted">Preview form. No data is sent.</p></div>
  <p class="form__status text text--sm text--muted" role="status" aria-live="polite"></p>
</form></div></div></div></section>
